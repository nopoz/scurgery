version: 2

updates:
  # The workflows pin actions by commit SHA, which is what makes a tampered
  # tag harmless. The cost of that is no update ever arrives on its own, so
  # this is what keeps the pins from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
