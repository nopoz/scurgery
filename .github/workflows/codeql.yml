name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run so newly-published queries flag latent issues between PRs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege by default; the analyze job opts back in to what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read           # read workflow run metadata
      contents: read
      security-events: write  # upload CodeQL results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # Ahead of init so autobuild uses the version go.mod declares rather
        # than whatever the runner image happens to ship.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:go"
